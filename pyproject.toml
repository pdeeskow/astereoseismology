[project]
name = "asteroseismologie"
version = "0.1.0"
description = "Asteroseismologie-Workflow für solar-like Oscillators mit TESS"
requires-python = ">=3.11"
dependencies = [
    "lightkurve>=2.4",
    "astropy>=6.0",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "numpy>=1.26",
]

[project.optional-dependencies]
pbjam = [
    "pbjam>=2.0",
    "dynesty>=2.1.5,<3",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
]
